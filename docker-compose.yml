services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["-m", "8222"]

  meilisearch:
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_MASTER_KEY: "${FLEXCATALOG_MEILI_MASTER_KEY:?Set FLEXCATALOG_MEILI_MASTER_KEY before starting, e.g. export FLEXCATALOG_MEILI_MASTER_KEY=$(openssl rand -base64 24)}"
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__DatabaseName: "flexcatalog"
      Nats__Url: "nats://nats:4222"
      Meilisearch__Url: "http://meilisearch:7700"
      # Known simplification (ADR 0007): reuses the same master key
      # FlexCatalog.SearchIndexer writes with. A production deployment
      # would give the API a search-only Meilisearch key instead -- see
      # Search/MeilisearchOptions.cs.
      Meilisearch__ApiKey: "${FLEXCATALOG_MEILI_MASTER_KEY:?Set FLEXCATALOG_MEILI_MASTER_KEY before starting, e.g. export FLEXCATALOG_MEILI_MASTER_KEY=$(openssl rand -base64 24)}"
      Jwt__Secret: "${FLEXCATALOG_JWT_SECRET:?Set FLEXCATALOG_JWT_SECRET before starting, e.g. export FLEXCATALOG_JWT_SECRET=$(openssl rand -base64 48)}"
      Jwt__Issuer: "flexcatalog"
      Jwt__Audience: "flexcatalog-clients"
      Jwt__ExpiryMinutes: "60"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  inventory-projector:
    build:
      context: .
      dockerfile: Dockerfile.projector
    restart: unless-stopped
    environment:
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__DatabaseName: "flexcatalog"
      Nats__Url: "nats://nats:4222"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy

  search-indexer:
    build:
      context: .
      dockerfile: Dockerfile.searchindexer
    restart: unless-stopped
    environment:
      Nats__Url: "nats://nats:4222"
      Meilisearch__Url: "http://meilisearch:7700"
      Meilisearch__ApiKey: "${FLEXCATALOG_MEILI_MASTER_KEY:?Set FLEXCATALOG_MEILI_MASTER_KEY before starting, e.g. export FLEXCATALOG_MEILI_MASTER_KEY=$(openssl rand -base64 24)}"
    depends_on:
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  mongo-data:
  meili-data:
