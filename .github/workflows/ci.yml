name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FlexCatalog.slnx

      - name: Format check (lint)
        run: dotnet format FlexCatalog.slnx --verify-no-changes --severity warn

      - name: Build
        run: dotnet build FlexCatalog.slnx --configuration Release --no-restore

      - name: Unit tests
        run: >
          dotnet test tests/FlexCatalog.UnitTests/FlexCatalog.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ./test-results

      - name: Integration tests (Testcontainers + real MongoDB)
        run: >
          dotnet test tests/FlexCatalog.IntegrationTests/FlexCatalog.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory ./test-results

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t flexcatalog-api:ci .

      - name: Build InventoryProjector image
        run: docker build -t flexcatalog-projector:ci -f Dockerfile.projector .

      - name: Build SearchIndexer image
        run: docker build -t flexcatalog-searchindexer:ci -f Dockerfile.searchindexer .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (csharp)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual

      # Explicit build: CodeQL traces this compilation to extract C#.
      - name: Build
        run: dotnet build FlexCatalog.slnx --configuration Release

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  dependency-scan:
    name: Dependency scan (NuGet vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore FlexCatalog.slnx

      # `dotnet list package --vulnerable` exits 0 even when it finds
      # vulnerabilities, so fail explicitly on its report text.
      - name: Fail on vulnerable packages
        run: |
          set -o pipefail
          dotnet list FlexCatalog.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see log above)"
            exit 1
          fi
          if grep -Eqi "error|unable to load the service index|failed to retrieve vulnerability" vulnerable.txt; then
            echo "::error::Vulnerability scan did not complete cleanly"
            exit 1
          fi
